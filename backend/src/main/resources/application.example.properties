spring.application.name=skybook-backend

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/skybook
spring.datasource.username=YOUR_POSTGRES_USERNAME
spring.datasource.password=YOUR_POSTGRES_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# SQL logging for development
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.skybook=DEBUG

# JWT settings
skybook.security.jwt.secret=YOUR_LOCAL_JWT_SECRET_WITH_AT_LEAST_32_BYTES
skybook.security.jwt.expiration-ms=3600000

# OpenAPI/Swagger settings
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# AI provider settings
spring.ai.openai.base-url=${SKYBOOK_OPENAI_BASE_URL:https://openai.generative.engine.capgemini.com/v1}
spring.ai.openai.api-key=${SKYBOOK_OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${SKYBOOK_OPENAI_CHAT_MODEL:openai.gpt-5-mini}

# AI memory/vector settings
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.platform=postgresql
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.schema-validation=${SKYBOOK_PGVECTOR_SCHEMA_VALIDATION:false}
spring.ai.vectorstore.pgvector.table-name=skybook_policy_vectors

# Optional one-time local admin bootstrap
skybook.admin.bootstrap.enabled=${SKYBOOK_ADMIN_BOOTSTRAP_ENABLED:false}
skybook.admin.bootstrap.full-name=${SKYBOOK_ADMIN_FULL_NAME:}
skybook.admin.bootstrap.email=${SKYBOOK_ADMIN_EMAIL:}
skybook.admin.bootstrap.password=${SKYBOOK_ADMIN_PASSWORD:}
